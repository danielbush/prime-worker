# Which model each agent name means.
#
# Format:
#
#   [defaults]                which harness each agent uses unless you say otherwise
#   [<harness>.<agent>]       one block per agent per harness
#     default = "<effort>"    the effort used unless the request names another
#     <effort> = "<model>"    the exact model string to pass to that harness
#     <effort>-fast = "..."   same effort on the harness's fast tier, used only
#                             when the request asks for fast
#
# An effort with no key is not available: say so rather than substituting.
# An agent with no block for a harness cannot run on it.
#
# Find model names with:  prime-agent model list <search>
#                         cursor-agent --list-models
# Effort levels, native:  off minimal low medium high xhigh max

[defaults]
grok = "cursor"
sol  = "codex"
astra = "codex"
opus = "claude-code"
fable = "claude-code"
kimi = "native"
deeppro = "native"
deepflash = "native"
glm = "native"


# Cursor: effort and speed are part of the model name, so every combination is
# listed. --trust is required for a directory Cursor has not seen before.

[cursor.grok]
default   = "high"
high      = "cursor-grok-4.6-high"
high-fast = "cursor-grok-4.6-high-fast"

[cursor.sol]
default     = "medium"
medium      = "gpt-5.6-sol-medium"
medium-fast = "gpt-5.6-sol-medium-fast"

[cursor.opus]
default   = "high"
high      = "claude-opus-5-thinking-high"
high-fast = "claude-opus-5-thinking-high-fast"


# Codex: -m <model> plus -c model_reasoning_effort=<effort>. No fast tier, so the
# model name is the same at every effort.

[codex.sol]
default = "medium"
medium  = "gpt-5.6-sol"
high    = "gpt-5.6-sol"

[codex.astra]
default = "low"
low     = "gpt-6-astra"
medium  = "gpt-6-astra"


# Claude Code: --model <model> --effort <effort>. No fast tier.

[claude-code.opus]
default = "medium"
medium  = "claude-opus-5"
high    = "claude-opus-5"

[claude-code.fable]
default = "medium"
low     = "claude-fable-5-1"
medium  = "claude-fable-5-1"
high    = "claude-fable-5-1"


# Native: an exact provider/model selector, with thinking = <effort>.

[native.grok]
default = "high"
high    = "openrouter/x-ai/grok-4.6"

[native.sol]
default = "medium"
medium  = "openai-codex/gpt-5.6-sol"

[native.astra]
default = "low"
low     = "openai-codex/gpt-6-astra"
medium  = "openai-codex/gpt-6-astra"

[native.opus]
default = "high"
high    = "openrouter/anthropic/claude-opus-5"

[native.kimi]
default = "high"
high    = "openrouter-routed/moonshotai/kimi-k3"

[native.deeppro]
default = "high"
high    = "openrouter-routed/deepseek/deepseek-v4-pro-0813"

[native.deepflash]
default = "high"
high    = "openrouter-routed/deepseek/deepseek-v4-flash-0731"

[native.glm]
default = "high"
high    = "openrouter-routed/z-ai/glm-5.3-flash"
